:root[data-theme="dark"]{--bg:#110c0b;--card:#1d1412;--ink:#efe4d0;--mut:#b49c80;--acc:#ff7a1a;--acc2:#ffb36b;--line:#4b2f22;--ok:#7fd18f;--bad:#ff7b66;--cell:#2a1d19;color-scheme:dark}
:root[data-theme="dark"] body.perfect{--acc:#7fd1a0;--acc2:#b6ecc9;--bg:#101a16}
body.perfect{--acc:#2f7d57;--acc2:#1f5a3f;--bg:#eef0df}
:root[data-theme="light"] body.perfect{--acc:#2f7d57;--acc2:#1f5a3f;--bg:#eef0df}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:19px/1.6 "EB Garamond",Georgia,serif;transition:background .4s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--card);border-bottom:1px solid var(--line);padding:.5rem .8rem}
.bar{max-width:760px;margin:auto;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.bar .t{display:flex;align-items:center;gap:.45rem;flex:1;font:700 1rem Cinzel,serif;color:var(--acc);cursor:pointer;min-width:120px}
button{font:inherit;cursor:pointer;border:1px solid var(--acc);background:transparent;color:var(--acc);padding:.3rem .8rem;border-radius:6px}
button:hover:not(:disabled){background:var(--acc);color:var(--bg)}
button.pri{background:var(--acc);color:var(--bg);font-weight:600}
button:disabled{opacity:.5;cursor:default}
.chips{max-width:760px;margin:.4rem auto 0;display:flex;gap:.35rem;flex-wrap:wrap}
.chips button{font-size:.8rem;padding:.1rem .6rem}.chips .on{background:var(--acc);color:var(--bg)}
main{max-width:760px;margin:auto;padding:1rem .9rem 3rem}
.banner,.hero{background:linear-gradient(rgba(12,6,4,.55),rgba(12,6,4,.8)),var(--valle) center/cover;color:#f4e8d0;border-radius:10px;padding:1.2rem 1.1rem;margin-bottom:1rem}
.hero{padding:3rem 1.2rem;text-align:center}.hero h1{font-size:clamp(1.8rem,7vw,3rem);margin:.2rem 0}.hero p{margin:0;opacity:.9}
#hk{height:1.7rem;width:auto}
.banner h2{margin:0;font-size:1.5rem}
p{margin:.7rem 0}p.d{font-style:italic;padding-left:.8rem;border-left:3px solid var(--line)}
.card,.puz{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1rem 1.1rem;margin:1rem 0}
.puz{border-left:5px solid var(--acc)}
.puz h3{margin:0 0 .4rem;font-size:1rem;color:var(--acc)}
.cipher{font:700 1.5rem Cinzel,serif;letter-spacing:.25em;color:var(--acc);display:block;text-align:center;margin:.5rem 0;word-break:break-word}
input[type=text],select{font:inherit;padding:.35rem .6rem;border:1px solid var(--line);border-radius:6px;background:var(--cell);color:var(--ink);max-width:100%}
.row{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.6rem;align-items:center}
.fb{margin-top:.5rem;min-height:1.2em}.bad{color:var(--bad)}.good{color:var(--ok);font-weight:600}
.hints{margin-top:.6rem;font-size:.95rem;color:var(--mut)}.hints div{border-top:1px dashed var(--line);padding:.3rem 0}
.opts{display:grid;gap:.5rem;margin-top:.6rem}.opts button{text-align:left;padding:.6rem .8rem}.opts small{display:block;opacity:.85}
.sud{display:grid;grid-template-columns:repeat(9,1fr);width:min(100%,370px);margin:.6rem auto;border:2px solid var(--ink)}
.sud input{width:100%;aspect-ratio:1;border:1px solid var(--line);background:var(--cell);color:var(--ink);text-align:center;font:700 1.15rem Cinzel,serif;padding:0;border-radius:0;min-width:0}
.sud input:disabled{opacity:1;-webkit-text-fill-color:var(--mut)}
.sud input.o{background:#f59a3c;color:#2a1b11;-webkit-text-fill-color:#2a1b11}
.sud input:nth-child(3n){border-right:2px solid var(--ink)}.sud input:nth-child(n+19):nth-child(-n+27),.sud input:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid var(--ink)}
table{border-collapse:collapse;font-size:.9rem}td,th{border:1px solid var(--line);padding:.2rem .5rem;text-align:center}
.sc{overflow-x:auto;max-width:100%}
.lg td{text-align:left}.lg select{font-size:.9rem}
figure{margin:1rem 0}figure img{width:100%;border-radius:8px;border:1px solid var(--line)}figcaption{font-size:.85rem;color:var(--mut);text-align:center}
.chapter-gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;margin-top:1rem}
figure.capitulo{margin:0;border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden;box-shadow:0 6px 18px rgba(43,25,14,.08)}
figure.capitulo img{display:block;width:100%;height:220px;object-fit:cover;border:0;border-radius:0}
figure.capitulo figcaption{padding:.7rem .8rem .8rem;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:700}
#ov{position:fixed;inset:0;z-index:20;background:rgba(10,5,4,.7);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 1rem) .8rem 2rem}
#ov.on{display:flex}#ov .card{max-width:640px;width:100%;margin:0}
.slot{display:inline-block;min-width:3rem;border:1px solid var(--line);border-radius:6px;padding:.2rem .6rem;margin:.2rem;text-align:center}
.slot b{display:block;font:700 1.4rem Cinzel,serif;color:var(--acc)}.slot span{font-size:.75rem;color:var(--mut)}
footer{text-align:center;font-size:.85rem;color:var(--mut);margin-top:2rem}
</style>

<script>
const STORY={"1a": ["Esta es la historia de Dante un sensible que carga el miedo, la tristeza y el dolor de los terrenales. Gav se le aparece y le promete encontrar en el Valle de los Susurros, un lugar donde su dolor pueda ser transformado. Dante acepta seguirle y entra en un mundo donde cada paso es una prueba. ","En el Valle de los Susurros no todo es lo que parece. Las sombras, los secretos y los recuerdos mastican la verdad. Dante descubre que el Valle no es un lugar cualquiera: es un reino de decisiones, de promesas y de condenas. ","Cada capítulo lo enfrentará a un acertijo, a una verdad oculta y a una elección que cambiará el destino de quien crea que sólo ha venido para escapar. "],"1b": ["Hay voces entre los muros y cada una pide ser escuchada. El joven descubre que el Valle del Susurros guarda más de lo que la mirada alcanza."],"2a": ["Dante se adentra en un corredor de piedra bajo el brillo de un extraño faro. Allí, junto a la Estatua, entiende que lo que parece un paseo puede ser, en realidad, un camino de supervivencia. ","Las decisiones importan. Una sola frase verdadera puede cambiar el rumbo del viaje. "],"2b": ["La puerta no se abre con fuerza sino con sentido. Y el sentido, en el Valle, siempre está codificado."],"3a": ["Dante llega a una sala mediada por el silencio. El roce del aire le recuerda que cada hora aquí cuenta. ","Aprende que el Valle se alimenta de recuerdos, y que cada secreto guardado puede abrir una puerta nueva. "],"4a": ["Un paso más y el destino aparece en forma de luz. La ciudad del valle cobra forma delante de Dante, enorme, silenciosa, casi inquietante."],"5a": ["Gav parece conocer cada rincón del Valle. Su mirada no es la de un aliado, sino la de alguien que está a punto de revelarle el verdadero alcance de la misión. ","La historia gotea en cada rincón y Dante empieza a comprender que no sólo debe escapar: debe entender a quién realmente está escapando. "],"5b": ["Los faroles iluminan una verdad que no se ve a simple vista. Nada aquí funciona al azar; cada luz guarda un mensaje."],"6a": ["El secreto del contrato aparece como un hilo entre el humo y la promesa. Dante siente que cada palabra tiene un peso más grande que el propio cielo. "],"6b": ["En la oscuridad, las sílabas y las vocales revelan lo que las páginas no quisieron decir. Hay una verdad que exige ser reunida."],"7a": ["La clave y el tiempo se vuelven aliados peligrosos. Dante encuentra una nota, una pregunta, una decisión. ","El Valle ya no es un escenario: es un mecanismo con reglas que pueden borrar o salvar. "],"8a": ["El origen del Valle se vuelve visible. Las escenas se desenredan y aparecen rostros, nombres, recuerdos, pactos y culpa. ","Dante ya no es sólo un sensible perdido: es el punto en que el destino se decide."],"9a": ["El final llega despacio, como un susurro que se queda. La decisión de quedarse o partir deja una huella ajena al miedo. ","El Valle exige la verdad, no la obediencia. Y Dante comprende que escapar no siempre significa irse. "],"9b": ["El último secreto se revela bajo la última mirada. Lo que parecía un final es, en realidad, la apertura de otra historia." ]};
const KEY="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAKAAAAGQCAYAAAApwms0AAEAAElEQVR42uy9d5SdV3n2/dtPO71NL5oZjXrvsi3LttwbBhcs0XsxBBIgIeUlAaGEQHpCQhzsEAghNItQjW1sgy13y+plNNL0eub0Xp66vz8kE5KQfLT[...";

document.documentElement.style.setProperty('--valle','url('+MAP+')');
const $=s=>document.querySelector(s);
const SOL="192386547684751329735924681573218496269437158841569732916843275358672914427195863";
const PUZ="092306547684751309735920081570218490269407158041069032916843275058602914407190863";
const ORG=[0,23,24,29,51,73,77];
const NW={uno:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,'treinta y dos':32};
const nm=s=>{s=String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim().replace(/^capitulo /,'');return NW[s]!=null?String(NW[s]):s};
const PL=['Estatua','Palacio','Pasillo de salida'],OB=['Llave dorada','Copia del contrato','Reloj de bolsillo'];
const LSOL={Dante:['Pasillo de salida','Reloj de bolsillo'],Gael:['Palacio','Copia del contrato'],Gav:['Estatua','Llave dorada']};

const C={
1:{theme:1,blocks:[{text:'1a'},{id:'1a',label:'Acertijo · La piedra',q:'Ayuda a Dante a descifrar qué dice la piedra:<span class="cipher">TÑURARZQZ</span>',ans:['felicidad'],hints:['Debes utilizar el Alfabeto del Valle (en el archivo).','Fíjate en la relación entre letras y el misterio del nombre.','Comienza por la última letra y prueba el patrón.']},{say:['Luego otras letras aparecen mágicamente en la piedra.']},{id:'1b',label:'Acertijo · El mensaje',q:'<span class="cipher">AQPRGOUK YÑRY</span>Descifra el mensaje. ¿A qué capítulo te envía?',ans:['6'],hints:['Usa el mismo Alfabeto del Valle que en la piedra.','Las letras del mensaje están invertidas respecto al orden normal.','La respuesta es un número del 1 al 9.']}]},
6:{theme:1,blocks:[{text:'6a'},{id:'6a',label:'Acertijo · La nota',q:'<span class="cipher">OTARTNOC</span>Descubre qué dice la palabra para saber qué debe hacer Dante.',ans:['contrato'],hints:['En el Valle nada se lee como parece.','Invierte la palabra en tu cabeza.','Se trata de algo que se firma y se guarda.']},{id:'6b',label:'Acertijo · Las vocales',q:'Cuenta cuántas vocales tiene la palabra. Ese número es el siguiente capítulo que debes leer.',ans:['3'],hints:['Las vocales son A, E, I, O, U. Cuéntalas bien.','La respuesta es un número pequeño.']}]},
3:{digit:[3,9],blocks:[{text:'3a'},{id:'3a',label:'Acertijo',q:'Si en el Valle hay una persona que lleva 35 años allí y Dante llegó hace 28 años, ¿cuántos años más que Dante lleva ese sensible en el Valle? <i>La respuesta te llevará al siguiente capítulo.</i>',ans:['7'],hints:['Resta.','35 - 28 = 7.']}]},
7:{blocks:[{text:'7a'},{id:'7a',label:'Acertijo · La secuencia',q:'<span class="cipher">2 → 4 → 8 → 16 → ?</span>¿Qué número sigue?',ans:['32'],hints:['Mira cómo pasa cada número al siguiente.','Cada número se duplica.']},{say:['Debajo encuentra una nota:','«Si el resultado es mayor que 10, utiliza la segunda llave. Si es menor o igual a 10, utiliza la tercera.»','Dante encuentra tres llaves: la <b>Llave 1</b> (roja), la <b>Llave 2</b> (plateada) y la <b>Llave 3</b> (negra).']},{id:'7b',type:'choice',label:'Acertijo · Las llaves',q:'¿Cuál debe utilizar Dante?',opts:[['Llave 1 · Roja'],['Llave 2 · Plateada'],['Llave 3 · Negra']],right:1,hints:['¿Es 32 mayor que 10?','La segunda llave es la correcta.']},{id:'7c',label:'Acertijo · El archivo',q:'Revisa la página de archivos del Valle: allí encontrarás a qué capítulo debes seguir con esta llave.',ans:['4'],hints:['Busca el «Decodificador de llaves» en el archivo del Valle.','La llaves plateada apunta al capítulo 4.']},{say:['Dante comprende que la llave puede abrir una parte del Valle a la que normalmente no tiene acceso.']}],go:4},
4:{blocks:[{text:'4a'}],go:5,goLabel:'Continuar al capítulo 5'},
5:{blocks:[{text:'5a'},{id:'5s',type:'sudoku',label:'Acertijo · El sudoku',q:'Completa el sudoku con los números que faltan. Presta especial atención a las casillas <b>naranjas</b>: sus números serán necesarios para continuar.',ans:[''],hints:['Revisa filas, columnas y bloques.','Los naranjas forman una clave.']},{id:'5w',label:'Acertijo · La clave',q:'Convierte los números de las casillas naranjas en letras con la «Ayuda para el sudoku». ¿Cuál es la primera palabra de la frase <b>«______ de Gav»</b>?',ans:['verdad'],hints:['Busca la clave en el archivo.','Las letras corresponderán a una palabra simple.']},{text:'5b'},{id:'5f',label:'Acertijo · Los faroles',q:'En el Valle hay <b>12 faroles</b> encendidos. Gav apaga <b>la mitad</b> antes de medianoche. Después, Dante enciende <b>2 faroles más</b>. Finalmente, quedan <b>5 faroles</b> apagados. ¿Cuántos faroles quedan encendidos al final?',ans:['5'],hints:['12 / 2 = 6 apagados.','6 apagados y 2 encendidos después = 8 encendidos.','Pero si al final quedan 5 apagados, entonces 7 encendidos.']}]},
8:{blocks:[{text:'8a'},{id:'8l',type:'logic',label:'Acertijo · Quién, dónde y con qué',q:'Reconstruye los movimientos con las pistas. Cada personaje, lugar y objeto aparece una sola vez.',hints:['Dante está con el reloj de bolsillo.','Gael se encuentra en el Palacio.','Gav lleva la llave dorada.']}]},
2:{blocks:[{text:'2a'},{id:'2p',type:'choice',label:'Acertijo · Tres caminos',q:'<b>Sólo una de las tres frases es verdadera.</b> ¿Qué camino deben tomar?',opts:[['Camino A','La Estatua está detrás del camino B.'],['Camino B','La Estatua está delante del camino C.'],['Camino C','La Estatua está al lado del camino A.']],right:2,hints:['La frase verdadera es la que no contradice las demás.','El camino correcto es el B.']},{text:'2b'},{id:'2d',label:'Acertijo · La frase de la puerta',q:'<span class="cipher">ARAP RENETNAM OTREIBA LE ONIMAC, ONU EBED RECENAMREP</span>Escribe la frase completa.',ans:['para mantener abierto el camino, una vez desaparece'],hints:['La frase está invertida.','Intenta leerla al revés.']},{id:'2n',label:'Acertijo · El capítulo',q:'Suma la cantidad de letras en el nombre de Gael y de Dante: ahí encontrarás a qué capítulo vas.',ans:['9'],hints:['Cuenta las letras de cada nombre.','Gael = 4; Dante = 5; 4 + 5 = 9.']}]},
9:{blocks:[{text:'9a'},{id:'9q',label:'Acertijo · ¿Quién se queda?',q:'Dante decide quedarse. Cuenta las letras del nombre de quien se queda y escribe el número. Guárdalo.',ans:['5'],hints:['Piensa en quién se queda.','La respuesta es 5.']},{text:'9b'},{id:'9f',label:'Código final',strip:1,q:'Recupera los números que guardaste durante el juego: capítulos <b>1, 3, 5 y 9</b>, en ese orden. Introduce el código.',ans:['9945'],hints:['Mira tu Libreta o tus respuestas guardadas.','La clave final es 9945.']}]}
};

let S={cur:0,seen:[],solved:{},digits:{},hints:{},sud:[],lg:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem('claus_final')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('claus_final',JSON.stringify(S))}catch(e){}};
function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e}
const para=p=>el('p',/^—/.test(p)?'d':'',p);

function go(n){S.cur=n;if(n&&!S.seen.includes(n))S.seen.push(n);save();render();scrollTo(0,0)}
function solve(b){S.solved[b.id]=1;if(b.digit)S.digits[b.digit[0]]=b.digit[1];save();const y=scrollY;render();scrollTo(0,y)}
function render(){
  const m=$('#main');m.innerHTML='';const ch=C[S.cur];
  document.body.classList.toggle('perfect',!!(ch&&ch.theme));
  const cp=$('#chips');cp.innerHTML='';
  S.seen.forEach(n=>{const b=el('button',n===S.cur?'on':'','Cap. '+n);b.onclick=()=>go(n);cp.append(b)});
  if(!ch){intro(m);return}
  if(ch.digit){S.digits[ch.digit[0]]=ch.digit[1];save()}
  m.append(el('div','banner','<div class="cz" style="opacity:.8;font-size:.8rem">VALLE DE LOS SUSURROS</div><h2>Capítulo '+S.cur+'</h2>'));
  let done=true;
  for(const b of ch.blocks){
   if(b.text)STORY[b.text].forEach(p=>m.append(para(p)));
   else if(b.say)b.say.forEach(p=>m.append(para(p)));
   else{const ok=!!S.solved[b.id];m.append(puzzle(b,ok));if(!ok){done=false;break}}
  }
  if(done&&ch.go){const r=el('div','row');const b=el('button','pri',(ch.goLabel||'Ir al capítulo '+ch.go)+' →');b.onclick=()=>go(ch.go);r.append(b);m.append(r)}
  const f=el('footer','','<button id="rs">Reiniciar progreso</button>');m.append(f);
  f.firstChild.onclick=function(){if(this.dataset.s){S={cur:0,seen:[],solved:{},digits:{},hints:{},sud:[],lg:{}};save();render();scrollTo(0,0)}else{this.dataset.s=1;this.textContent='¿Seguro? Pulsa otra vez para resetear';}};
}
function intro(m){
  m.append(el('div','hero','<div class="cz" style="opacity:.8">ESCAPE BOOK</div><h1>La cláusula final</h1><p>Escapa del Valle de los Susurros</p>'));
  m.append(el('div','card','<h3 class="cz">Capítulos ilustrados</h3><div class="chapter-gallery"><figure class="capitulo"><img src="img/capitulo_1.png" alt="Un hombre alto con capa oscura extiende la mano a un joven de pelo rizado en una cueva"><figcaption>Capítulo 1</figcaption></figure><figure class="capitulo"><img src="img/capitulo_2.png" alt="El joven contempla una ciudad de torres blancas junto a un lago y cascadas"><figcaption>Capítulo 2</figcaption></figure><figure class="capitulo"><img src="img/capitulo_3.png" alt="Manos sostienen una piedra con runas doradas brillantes"><figcaption>Capítulo 3</figcaption></figure><figure class="capitulo"><img src="img/capitulo_4.png" alt="Runas luminosas grabadas en una roca, con un destello dorado a su alrededor"><figcaption>Capítulo 4</figcaption></figure><figure class="capitulo"><img src="img/capitulo_5.png" alt="Un hombre sonriente con túnica clara recibe al joven frente a un grupo de habitantes de la ciudad"><figcaption>Capítulo 5</figcaption></figure><figure class="capitulo"><img src="img/capitulo_6.png" alt="El joven observa a una multitud de figuras de ojos brillantes en un salón oscuro"><figcaption>Capítulo 6</figcaption></figure><figure class="capitulo"><img src="img/capitulo_7.png" alt="Un hombre con capa negra examina una llave sobre un escritorio con pergaminos, tres llaves y velas"><figcaption>Capítulo 7</figcaption></figure><figure class="capitulo"><img src="img/capitulo_8.png" alt="El joven lee un pergamino con un símbolo dorado mientras otra persona lo observa al fondo"><figcaption>Capítulo 8</figcaption></figure><figure class="capitulo"><img src="img/capitulo_9.png" alt="Dos figuras encapuchadas miran una ciudad bajo un cielo rojo al atardecer"><figcaption>Capítulo 9</figcaption></figure></div>'));
  m.append(el('div','card','<h3 class="cz">¿Qué es un sensible?</h3><p>En Althera existen los Terrenales y los Sensibles. Los Terrenales viven bajo la idea de la felicidad. Los Sensibles, en cambio, parecen estar más cerca de los secretos del Valle que del mundo que los rodea.</p><p>La historia te invita a explorar esos límites, a escuchar las palabras que quedan en pausa y a decidir si el destino vale la pena.</p>'));
  const f=el('figure','','<img alt="Mapa mundial del reino de Althera y el Valle de los Susurros" src="'+MAP+'"><figcaption>Althera, al oeste; el Valle de los Susurros, al este, más allá del mar.</figcaption>');
  m.append(f);
  m.append(el('div','card','<h3 class="cz">Reglas</h3><p><b>No leas este libro en orden.</b> A medida que se desarrolla la historia encontrarás acertijos que indican cuál es el siguiente capítulo.</p><p>Algunas respuestas se guardan en tu libreta y otras quedan escondidas detrás de huellas, frases y símbolos.</p>'));
  const r=el('div','row');const b=el('button','pri',S.seen.length?'Continuar':'Comenzar en el capítulo 1');b.onclick=()=>go(S.seen.length?S.seen[S.seen.length-1]:1);r.append(b);m.append(r);
}
function hintsUI(b){
  const w=el('div');if(!b.hints||!b.hints.length)return w;
  const box=el('div','hints'),bt=el('button','');
  const upd=()=>{const n=S.hints[b.id]||0;box.innerHTML='';b.hints.slice(0,n).forEach((h,i)=>box.append(el('div','','<b>Pista '+(i+1)+':</b> '+h)));bt.textContent=n>=b.hints.length?'Sin más pista disponible':'Pista ('+n+'/'+b.hints.length+')'};
  bt.onclick=()=>{S.hints[b.id]=(S.hints[b.id]||0)+1;save();upd()};upd();
  w.append(bt,box);return w;
}
function puzzle(b,ok){
  const c=el('div','puz','<h3 class="cz">'+(b.label||'Acertijo')+'</h3><div>'+b.q+'</div>');
  if(b.type==='sudoku')return sudoku(b,ok,c);
  if(ok){c.append(el('div','fb good',b.ok||''));return c}
  const fb=el('div','fb');
  if(b.type==='choice'){
   const o=el('div','opts');b.opts.forEach((x,i)=>{const bt=el('button','',x[0]+(x[1]?'<small>'+x[1]+'</small>':''));bt.onclick=()=>i===b.right?solve(b):(fb.className='fb bad',fb.textContent='No es esa. Inténtalo de nuevo.');o.append(bt)});c.append(o,fb);}
  else if(b.type==='logic'){
   b.hintsList=1;c.append(logic(b,fb));
  }else{
   const r=el('div','row'),i=el('input');i.type='text';i.autocomplete='off';i.placeholder='Tu respuesta';const bt=el('button','pri','Comprobar');
   const chk=()=>{let v=nm(i.value);if(b.strip)v=v.replace(/ /g,'');if(b.ans.some(a=>nm(a)===v))solve(b);else{fb.className='fb bad';fb.textContent='Esa no es la respuesta. Inténtalo de nuevo.'}};
   bt.onclick=chk;i.onkeydown=e=>{if(e.key==='Enter')chk()};r.append(i,bt);c.append(r);
  }
  c.append(fb,hintsUI(b));return c;
}
function sudoku(b,ok,c){
  const g=el('div','sud');
  for(let k=0;k<81;k++){const i=el('input',ORG.includes(k)?'o':'');i.type='text';i.inputMode='numeric';i.maxLength=1;
   if(PUZ[k]!=='0'){i.value=PUZ[k];i.disabled=true}else if(ok){i.value=SOL[k];i.disabled=true}else{i.value=S.sud[k]||'';i.oninput=()=>{i.value=i.value.replace(/[^1-9]/g,'');S.sud[k]=i.value;save();};i.onblur=()=>{if(!i.value)delete S.sud[k];save();};}
   g.append(i)}
  c.append(g);
  if(ok){c.append(el('div','fb good',b.ok));return c}
  const fb=el('div','fb'),r=el('div','row'),bt=el('button','pri','Comprobar sudoku');
  bt.onclick=()=>{let miss=0,bad=0;for(let k=0;k<81;k++)if(PUZ[k]==='0'){if(!S.sud[k])miss++;else if(S.sud[k]!==SOL[k])bad++}
   if(!miss&&!bad)solve(b);else{fb.className='fb bad';fb.textContent=bad?'Hay números incorrectos. Revisa filas, columnas y bloques.':'Aún faltan casillas por completar.'}};
  r.append(bt);c.append(r,fb,hintsUI(b));return c;
}
function logic(b,fb){
  const w=el('div');
  w.append(el('div','card','<b>Personajes</b> · <b>Dante</b>: mano derecha de Gav. <b>Gael</b>: recién llegado, acaba de firmar. <b>Gav</b>: gobernante del Valle, el único con acceso a los secretos.'));
  const t=el('table','lg','<tr><th></th><th>Lugar</th><th>Objeto</th></tr>');
  const sel=(n,j,L)=>{const s=el('select','','<option value="">—</option>'+L.map(x=>'<option>'+x+'</option>').join(''));s.value=(S.lg[n]||[])[j]||'';s.onchange=()=>{S.lg[n]=S.lg[n]||['',''];S.lg[n][j]=s.value;save();};return s;};
  Object.keys(LSOL).forEach(n=>{const tr=el('tr','','<th>'+n+'</th>');const a=el('td'),o=el('td');a.append(sel(n,0,PL));o.append(sel(n,1,OB));tr.append(a,o);t.append(tr)});
  const sc=el('div','sc');sc.append(t);w.append(sc);
  const bt=el('button','pri','Comprobar');bt.style.marginTop='.6rem';
  bt.onclick=()=>{const okk=Object.keys(LSOL).every(n=>(S.lg[n]||[])[0]===LSOL[n][0]&&(S.lg[n]||[])[1]===LSOL[n][1]);if(okk)solve(b);else{fb.className='fb bad';fb.textContent='Alguna combinación no encaja. Vuelve a comprobar quién está en cada lugar y con qué objeto.'}};
  w.append(bt);return w;
}
function panel(k){
  const o=$('#ov'),c=$('#ovc');let h='<div class="row" style="justify-content:space-between;margin:0"><h3 class="cz" style="margin:0">'+(k==='a'?'Archivo del valle':'Libreta')+'</h3><button id="x" class="danger">Cerrar</button></div>';
  if(k==='a'){const A='ABCDEFGHIJKLMNÑOPQRSTUVWXYZ',B='QMAZÑTBXRHUCWEKPIVDYGONSJLF';
   h+='<p><i>Recuerda esta página, podrías necesitarla más adelante.</i></p><h3 class="cz">Alfabeto de los susurros</h3><div class="sc"><table><tr>'+A.split('').map(x=>'<td>'+x+'</td>').join('')+'</tr><tr>'+B.split('').map(x=>'<td>'+x+'</td>').join('')+'</tr></table></div>'
   +'<h3 class="cz">Decodificador de llaves</h3><p>Rojo: Capítulo 6<br>Negro: Capítulo 2<br>Plateado: Capítulo 4</p>'
   +'<h3 class="cz">Ayuda para el sudoku</h3><div class="sc"><table><tr><th>Número</th>'+['1','2','3','4','5','6','7'].map(x=>'<td>'+x+'</td>').join('')+'</tr><tr><th>Letra</th>'+['E','U','A','S','A','T','T'].map(x=>'<td><b>'+x+'</b></td>').join('')+'</tr></table></div>'
   +'<p><b>¿Cómo funciona?</b></p><ol><li>Completa primero el sudoku.</li><li>Identifica los números de las casillas naranjas.</li><li>Busca cada número en la clave.</li><li>Reemplaza cada número por la letra correspondiente.</li><li>Lee la frase y descubre la palabra oculta.</li></ol>';
  }else{h+='<p>Los números que vayas descubriendo se guardan aquí.</p>'+[1,3,5,9].map(n=>'<div class="slot"><span>Cap. '+n+'</span><b>'+(S.digits[n]??'?')+'</b></div>').join('')+'<p><i>Con ellos podrás abrir la puerta final.</i></p>';
  }
  c.innerHTML=h;o.classList.add('on');$('#x').onclick=()=>o.classList.remove('on');
}
$('#ov').onclick=e=>{if(e.target.id==='ov')e.target.classList.remove('on')};
$('#bA').onclick=()=>panel('a');$('#bL').onclick=()=>panel('l');$('#home').onclick=()=>go(0);
$('#bT').onclick=()=>{const r=document.documentElement,d=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=d?'light':'dark'};
if(S.cur&&!C[S.cur])S.cur=0;
render();
</script>
</body>
</html>
