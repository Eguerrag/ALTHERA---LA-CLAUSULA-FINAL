<style>
:root{--bg:#eadfc2;--card:#f7efd9;--ink:#2a1b11;--mut:#6a5236;--acc:#b03a0c;--acc2:#7d2607;--line:#c8b087;--ok:#2f6b3a;--bad:#a1230f;--cell:#fffaf0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#110c0b;--card:#1d1412;--ink:#efe4d0;--mut:#b49c80;--acc:#ff7a1a;--acc2:#ffb36b;--line:#4b2f22;--ok:#7fd18f;--bad:#ff7b66;--cell:#2a1d19;color-scheme:dark}
:root:not([data-theme="light"]) body.perfect{--acc:#7fd1a0;--acc2:#b6ecc9;--bg:#101a16}}
:root[data-theme="dark"]{--bg:#110c0b;--card:#1d1412;--ink:#efe4d0;--mut:#b49c80;--acc:#ff7a1a;--acc2:#ffb36b;--line:#4b2f22;--ok:#7fd18f;--bad:#ff7b66;--cell:#2a1d19;color-scheme:dark}
:root[data-theme="dark"] body.perfect{--acc:#7fd1a0;--acc2:#b6ecc9;--bg:#101a16}
body.perfect{--acc:#2f7d57;--acc2:#1f5a3f;--bg:#eef0df}
:root[data-theme="light"] body.perfect{--acc:#2f7d57;--acc2:#1f5a3f;--bg:#eef0df}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:19px/1.6 "EB Garamond",Georgia,serif;transition:background .4s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
h1,h2,h3,.cz{font-family:Cinzel,Georgia,serif;letter-spacing:.04em}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--card);border-bottom:1px solid var(--line);padding:.5rem .8rem}
.bar{max-width:760px;margin:auto;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.bar .t{flex:1;font:700 1rem Cinzel,serif;color:var(--acc);cursor:pointer;min-width:120px}
button{font:inherit;cursor:pointer;border:1px solid var(--acc);background:transparent;color:var(--acc);padding:.3rem .8rem;border-radius:6px}
button:hover:not(:disabled){background:var(--acc);color:var(--bg)}
button.pri{background:var(--acc);color:var(--bg);font-weight:600}
button:disabled{opacity:.5;cursor:default}
.chips{max-width:760px;margin:.4rem auto 0;display:flex;gap:.35rem;flex-wrap:wrap}
.chips button{font-size:.8rem;padding:.1rem .6rem}.chips .on{background:var(--acc);color:var(--bg)}
main{max-width:760px;margin:auto;padding:1rem .9rem 3rem}
.banner,.hero{background:linear-gradient(rgba(12,6,4,.55),rgba(12,6,4,.8)),var(--valle) center/cover;color:#f4e8d0;border-radius:10px;padding:1.2rem 1.1rem;margin-bottom:1rem}
.hero{padding:3rem 1.2rem;text-align:center}.hero h1{font-size:clamp(1.8rem,7vw,3rem);margin:.2rem 0}.hero p{margin:0;opacity:.9}
.hero{background:radial-gradient(ellipse at 50% 28%,#4d230a 0%,#1c0f0a 62%,#0e0807 100%)}.hero img{display:block;height:190px;width:auto;margin:0 auto 1rem;filter:drop-shadow(0 0 22px rgba(255,140,40,.45))}
.banner h2{margin:0;font-size:1.5rem}
p{margin:.7rem 0}p.d{font-style:italic;padding-left:.8rem;border-left:3px solid var(--line)}
.card,.puz{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1rem 1.1rem;margin:1rem 0}
.puz{border-left:5px solid var(--acc)}
.puz h3{margin:0 0 .4rem;font-size:1rem;color:var(--acc)}
.cipher{font:700 1.5rem Cinzel,serif;letter-spacing:.25em;color:var(--acc);display:block;text-align:center;margin:.5rem 0;word-break:break-word}
input[type=text],select{font:inherit;padding:.35rem .6rem;border:1px solid var(--line);border-radius:6px;background:var(--cell);color:var(--ink);max-width:100%}
.row{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.6rem;align-items:center}
.fb{margin-top:.5rem;min-height:1.2em}.bad{color:var(--bad)}.good{color:var(--ok);font-weight:600}
.hints{margin-top:.6rem;font-size:.95rem;color:var(--mut)}.hints div{border-top:1px dashed var(--line);padding:.3rem 0}
.opts{display:grid;gap:.5rem;margin-top:.6rem}.opts button{text-align:left;padding:.6rem .8rem}.opts small{display:block;opacity:.85}
.sud{display:grid;grid-template-columns:repeat(9,1fr);width:min(100%,370px);margin:.6rem auto;border:2px solid var(--ink)}
.sud input{width:100%;aspect-ratio:1;border:1px solid var(--line);background:var(--cell);color:var(--ink);text-align:center;font:700 1.15rem Cinzel,serif;padding:0;border-radius:0;min-width:0}
.sud input:disabled{opacity:1;-webkit-text-fill-color:var(--mut)}
.sud input.o{background:#f59a3c;color:#2a1b11;-webkit-text-fill-color:#2a1b11}
.sud input:nth-child(3n){border-right:2px solid var(--ink)}.sud input:nth-child(n+19):nth-child(-n+27),.sud input:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid var(--ink)}
table{border-collapse:collapse;font-size:.9rem}td,th{border:1px solid var(--line);padding:.2rem .5rem;text-align:center}
.sc{overflow-x:auto;max-width:100%}
.lg td{text-align:left}.lg select{font-size:.9rem}
figure{margin:1rem 0}figure img{width:100%;border-radius:8px;border:1px solid var(--line)}figcaption{font-size:.85rem;color:var(--mut);text-align:center}
#ov{position:fixed;inset:0;z-index:20;background:rgba(10,5,4,.7);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 1rem) .8rem 2rem}
#ov.on{display:flex}#ov .card{max-width:640px;width:100%;margin:0}
.slot{display:inline-block;min-width:3rem;border:1px solid var(--line);border-radius:6px;padding:.2rem .6rem;margin:.2rem;text-align:center}
.slot b{display:block;font:700 1.4rem Cinzel,serif;color:var(--acc)}.slot span{font-size:.75rem;color:var(--mut)}
footer{text-align:center;font-size:.85rem;color:var(--mut);margin-top:2rem}
</style>
</head>

<script>
const STORY={"1a": ["Esta es la historia de Dante un sensible que carga el miedo, la tristeza y el dolor de los terrenales. Gav se le aparece y le promete encontrar en el Valle de los Susurros, una ciudad perfecta donde podrá sentir todas las emociones buenas, como la felicidad, y dejar de ser la persona que era.", "Dante emocionado acepta y llega al valle, allí atraviesa la puerta blanca que se encuentra frente a él. Mira con asombro el lugar en el que se encuentra. Al entrar ve una enorme cueva de piedra. El pasto está completamente limpio y parejo, de una cascada cae el agua que es transparente y tranquila, y la cueva tiene grandes aberturas por donde entra la luz. Las paredes de roca tienen formas naturales muy definidas y todo se ve intacto, como si nadie hubiera estado allí antes.", "-Bienvenido al valle de los susurros, Dante aquí podrás encontrar lo que siempre quisiste ser, feliz- le dice Gav.", "Dante mira todo a su alrededor con fascinación, piensa que por primera vez en su vida podrá vivir para sí mismo y no para otros, que quizá pueda vivir sin miedo, tristeza ni dolor. Gav saca una piedra que tiene unas palabras grabadas en ella.", "Dante dime lo que dice en la piedra, es el código para entrar al Valle -Gav."], "6a": ["Luego de decirle el código a Gav, las puertas del valle se abren y Dante entra donde Gav recibe a los nuevos sensibles. Allí todo parece perfecto. Las personas sonríen. Nadie parece tener preocupaciones. Aunque Dante nota que hay algo extraño y es que ninguna de estas personas parpadea. Sigue caminando junto a Gav hasta que entran al castillo. Allí en un escritorio encuentra una pequeña nota:"], "3a": ["Dante reconoce la palabra. Es lo que todos los sensibles deben firmar al llegar. Abre el cajón del escritorio y ve el documento. Es el contrato. Es en este momento en el que empieza a entender que aquella ciudad perfecta tiene un precio. En la parte de abajo del contrato al lado de la firma aparece una frase: “Una vez firmado, el vínculo comenzará a cerrarse.”", "Dante está sentado frente a Gav, frente a ellos el contrato encima de la mesa.", "—No tienes por qué estar asustado, solo tienes que firmar – le dice Gav", "Dante mira el documento y ve el reloj en la pared. El reloj marca: 9:00 P. M.", "Guarda el número de la hora.", "Dante firma el contrato que Gav le da y se lo entrega. En el momento en que la firma queda sellada, la fachada perfecta desaparece. La ciudad revela todo lo que estaba oculto y es que los sensibles que llegaron antes que él están esclavizados por el dios.", "El cielo se oscurece y esas calles antes perfectas se transforman ante sus ojos. Los edificios están deteriorados y las personas antes sonrientes ya no están. Dante mira a su alrededor y ve que los sensibles que llegaron antes que él están ahí, pero ya no parecen libres y ahora trabajan bajo las órdenes de Gav.", "—Bienvenido al verdadero Valle – le dice Gav con una sonrisa.", "Dante intenta escapar varias veces y cada vez fracasa de nuevo, busca rutas escondidas, observa las puertas, memoriza caminos y trata de entender cómo funciona aquel lugar. Pero el Valle siempre parece estar 2 pasos adelante de él. Y va pasando el tiempo hasta que entiende que Gav controla todo y que mientras siga enfrentándolo, nunca encontrará una salida entonces cambia de estrategia. Si no puede escapar de Gav, tendrá que conseguir que confíe en él."], "7a": ["Fueron pasando los años y Dante ya había perdido la esperanza de huir. Dante finge lealtad, cumple las órdenes de Gav sin cuestionarlas ni rebelarse. Está presente cuando Gav toma decisiones y logra conocer lugares del Valle que los demás sensibles nunca han visto. Va descubriendo de a poco los patrones de Gav y llega a la conclusión de que nunca hace nada al azar. Con el tiempo, Dante se gana su confianza y se convierte en la mano derecha de Gav.", "Una noche Dante estaba organizando unos contratos de Gav y encuentra sobre el escritorio una secuencia que Gav dejó escrita:"], "4a": ["Dante camina por el palacio y llega a una puerta que jamás ha visto que había adentro, utiliza la llave plateada y la cerradura se abre, camina hacia adentro y encuentra una pequeña habitación que nunca había visto. Allí hay documentos, registros y objetos que Gav mantiene lejos de los demás.", "Dante comienza a revisar y se emociona al pensar que durante años había buscado una debilidad y que tal vez finalmente la había encontrado. Entre los documentos descubre información sobre los contratos. Dante lee varias veces hasta que comprende la verdadera naturaleza de los contratos y es que estos pueden romperse, pero con una condición muy importante y es que el vínculo debe romperse antes de que pasen las primeras 24 horas desde la firma. Después de ese tiempo, el contrato se sella por completo y luego de sellado escapar se vuelve imposible.", "Dante se queda completamente quieto ya que durante muchos años había pensado que no había salida y ahora sabe que sí, pero el problema es que Gav guarda los contratos en una bóveda y solo él tiene la llave por lo que recuperarlos es muy difícil.", "—Entonces tendré que encontrar una forma de llegar a esos contratos – Dante susurra para sí mismo.", "Guarda cuidadosamente la información y deja todo como se encontraba ya que no puede permitir que Gav descubra que sabe la verdad."], "5a": ["Dante continúa fingiendo lealtad, pasa más el tiempo y su posición junto a Gav se vuelve cada vez más importante. Con los años, se convierte en una persona indispensable a su lado y mientras tanto continúa ocultando sus verdaderas intenciones y recolectando toda la información que puede encontrar. Todo sigue así un tiempo hasta que un día llega alguien nuevo al Valle.", "Dante lo ve atravesar el mismo portal de piedra por el que él entró muchos años atrás, su nombre es Gael, Dante reconoce inmediatamente aquella expresión de esperanza que él tenía cuando llegó. Gael se acerca a Gav y este le habla de una ciudad perfecta donde promete una vida sin miedo, sin tristeza y sin dolor. Dante observa en silencio sin poder intervenir frente a Gav. Gael firma el contrato, la fachada desaparece y Gael descubre la verdad. Dante espera a que Gav se aleje y entonces decide acercarse, no quiere permitir que Gael pase lo mismo que él.", "—No confíes en él – le susurra Dante.", "Gael lo mira confundido.", "—¿Tú trabajas para Gav?", "—Sí, pero no estoy de su lado – Dante.", "Dante le explica lo que descubrió años atrás y le advierte que el contrato puede romperse, pero solo durante las primeras 24 horas.", "—¿Y dónde está el mío? ¿Cómo lo recupero? – Gael preocupado.", "—Gav los guarda en una bóveda.", "—¿Puedes abrirla?", "Dante niega con la cabeza.", "—Solo Gav tiene la llave. Pero sé cómo encontrarla.", "Antes de marcharse, Dante le entrega una hoja.", "—Necesito que resuelvas esto, lo encontré en el estudio de Gav, pero no he podido descubrir que significa, ayúdame y estaremos cerca de salir de aquí. Debes ser rápido, no tenemos mucho tiempo. Aquí descubriremos el lugar de la bóveda y ya solo nos faltaría recuperar la llave – le dice Dante a Gael."], "5b": ["Dante mira a Gael.", "—Ahí es donde guarda los contratos, debemos ir – Gael dice emocionado."], "8a": ["Dante sabe que no puede entrar directamente a la bóveda y que Gav es el único que puede acceder a ella, pero para descubrir cómo recuperar el contrato necesitan reconstruir sus movimientos. Entre los documentos que había conseguido encuentra un registro. En él aparecen tres personas, tres lugares y tres objetos."], "8b": ["Dante comprende que no necesitan enfrentarse a Gav para recuperar el contrato. Deben aprovechar la posición de cada uno y el tiempo que queda."], "2a": ["Dante sabe que no pueden entrar a la Estatua mientras Gav esté allí y gracias a los años que ha sido su mano derecha, conoce los movimientos que Gav realiza cada noche. Hay una hora en la que Gav abandona el palacio para recorrer los límites del Valle y asegurarse de que nadie intente escapar. Dante espera hasta que llega ese momento. Dante vigila a Gav y ve que deja la llave guardada en un cofre de su habitación y sale. Desde una de las ventanas del palacio observa cómo Gav se aleja va hacia la habitación rompe el cofre y saca la llave.", "—Ahora – dice Dante apurado", "Dante y Gael salen del palacio y avanzan rápidamente hacia la zona más alejada del Valle. Después de varios minutos, dejan atrás los caminos conocidos y entran en un bosque oscuro y silencioso. Entre los árboles, finalmente aparece la Estatua. Pero antes de llegar, el sendero se divide en tres caminos."], "2b": ["Dante señala el segundo camino.", "—Es por aquí.", "Gael lo sigue y después de avanzar entre los árboles, el camino termina frente a la enorme Estatua, Dante mira hacia los alrededores y ve que no hay nadie y que Gav todavía no ha regresado.", "—¿Es aquí? - pregunta Gael.", "—Sí. Aquí guarda los contratos.", "Ambos se acercan a la Estatua y ven que en la parte trasera hay una pequeña puerta, Dante saca la llave y abre la cerradura. Adentro ven los contratos de todos los sensibles que están en el Valle, muchos de ellos ya sellados, incluido el de Dante. Dante busca rápidamente y finalmente encuentra lo que buscaba. Dante le entrega su contrato a Gael.", "—Tenemos menos tiempo del que parece -Dante.", "Gael rompe el contrato y por unos pocos segundos nada pasa, pero después el Valle comienza a temblar fuertemente y el camino de la salida comienza a abrirse frente a ellos. Pero una frase aparece sobre la puerta:"], "9a": ["—Nos vamos los dos – dice Gael.", "—No podemos – Dante niega.", "—Tiene que existir otra forma.", "—Llevo años buscando una – dice Dante con la cabeza baja.", "—Tú acabas de llegar. Yo ya conozco este lugar.", "—No.", "—Cuando llegaste, querías escapar de todo lo que sentías – Dante sonríe.", "—Dante...", "—Ahora puedes elegir qué hacer con tu vida.", "Dante decide quedarse."], "9b": ["Entonces una voz aparece detrás de ellos.", "—Después de tantos años...", "Dante se gira.", "Es Gav.", "El camino está abierto.", "—Ven conmigo- Gael mira a Dante.", "Dante niega.", "—Tú tienes que salir.", "—No pienso dejarte.", "Dante mira hacia la puerta.", "—Si te quedas, el camino se cerrará.", "Gael finalmente comprende y corre hacia la salida mientras Dante permanece atrás y se abalanza sobre Gav. Lo logra tumbar al suelo y comienzan a pelear.", "—Después de todos estos años, ¿así me pagas? – mientras intenta apartar a Dante", "Dante lo mira.", "—No.", "Pausa.", "—Yo no te debo nada.", "Gael desaparece por la salida y el camino comienza a cerrarse, Dante permanece en el Valle, pero esta vez no porque Gav lo haya obligado sino porque él decidió quedarse."]};

function go(n){S.cur=n;if(n&&!S.seen.includes(n))S.seen.push(n);save();render();scrollTo(0,0)}
function solve(b){S.solved[b.id]=1;if(b.digit)S.digits[b.digit[0]]=b.digit[1];save();const y=scrollY;render();scrollTo(0,y)}
function render(){
 const m=$('#main');m.innerHTML='';const ch=C[S.cur];
 document.body.classList.toggle('perfect',!!(ch&&ch.theme));
 const cp=$('#chips');cp.innerHTML='';
 S.seen.forEach(n=>{const b=el('button',n===S.cur?'on':'','Cap. '+n);b.onclick=()=>go(n);cp.append(b)});
 if(!ch){intro(m);return}
 if(ch.digit){S.digits[ch.digit[0]]=ch.digit[1];save()}
 m.append(el('div','banner','<div class="cz" style="opacity:.8;font-size:.8rem">VALLE DE LOS SUSURROS</div><h2>Capítulo '+S.cur+'</h2>'));
 let done=true;
 for(const b of ch.blocks){
  if(b.text)STORY[b.text].forEach(p=>m.append(para(p)));
  else if(b.say)b.say.forEach(p=>m.append(para(p)));
  else{const ok=!!S.solved[b.id];m.append(puzzle(b,ok));if(!ok){done=false;break}}
 }
 if(done&&ch.go){const r=el('div','row');const b=el('button','pri',(ch.goLabel||'Ir al capítulo '+ch.go)+' →');b.onclick=()=>go(ch.go);r.append(b);m.append(r)}
 const f=el('footer','','<button id="rs">Reiniciar progreso</button>');m.append(f);
 f.firstChild.onclick=function(){if(this.dataset.s){S={cur:0,seen:[],solved:{},digits:{},hints:{},sud:[],lg:{}};save();render();scrollTo(0,0)}else{this.dataset.s=1;this.textContent='¿Seguro? Pulsa otra vez'}}
}
function intro(m){
 m.append(el('div','hero','<img alt="Llave antigua" src="'+KEY+'"><div class="cz" style="opacity:.8">ESCAPE BOOK</div><h1>La cláusula final</h1><p>Escapa del Valle de los Susurros</p>'));
 m.append(el('div','card','<h3 class="cz">¿Qué es un sensible?</h3><p>En Althera existen los Terrenales y los Sensibles. Los Terrenales viven bajo la idea de la felicidad. Los Sensibles, en cambio, pueden sentir con mayor intensidad las emociones negativas, como la tristeza, el miedo, la rabia y el dolor. También pueden percibir y recibir emociones de otras personas.</p><p><i>Por eso, su existencia debe permanecer oculta.</i></p><h3 class="cz">¿Quién es Gav?</h3><p>Muy lejos de Althera existe un lugar llamado Valle de los Susurros. Allí habita Gav, conocido como el dios de ese lugar. Su presencia está relacionada con los Sensibles, aunque muy pocos conocen su existencia.</p><h3 class="cz">¿Qué es el Valle de los Susurros?</h3><p>Un lugar lejos de Althera, oculto más allá de los territorios conocidos. Para quienes viven en Althera, el Valle no existe. Pero algunos conocen una historia diferente. <i>Aquí nada es lo que parece.</i></p>'));
 const f=el('figure','','<img alt="Mapa mundial del reino de Althera y el Valle de los Susurros" src="'+MAP+'"><figcaption>Althera, al oeste; el Valle de los Susurros, al este, más allá del mar de emociones caóticas.</figcaption>');m.append(f);
 m.append(el('div','card','<h3 class="cz">Reglas</h3><p><b>No leas este libro en orden.</b> A medida que se desarrolla la historia encontrarás acertijos que indican cuál es el siguiente capítulo o información que necesitarás después.</p><p>Recuerda: en el Valle de los Susurros <b>nada se lee como se escribe</b>.</p><p>Los dígitos que obtengas en los capítulos 1, 3, 5 y 9 forman un código: tu <b>Libreta</b> los guarda para el final. El <b>Archivo</b> contiene las claves que podrías necesitar, y cada acertijo tiene sus pistas.</p><p><i>Te deseo mucha suerte. La necesitarás para escapar del Valle de los Susurros.</i></p>'));
 const r=el('div','row');const b=el('button','pri',S.seen.length?'Continuar':'Comenzar en el capítulo 1');b.onclick=()=>go(S.seen.length?S.seen[S.seen.length-1]:1);r.append(b);m.append(r);
}
function hintsUI(b){
 const w=el('div');if(!b.hints||!b.hints.length)return w;
 const box=el('div','hints'),bt=el('button','');
 const upd=()=>{const n=S.hints[b.id]||0;box.innerHTML='';b.hints.slice(0,n).forEach((h,i)=>box.append(el('div','','<b>Pista '+(i+1)+':</b> '+h)));bt.textContent=n>=b.hints.length?'Sin más pistas':'💡 Pista ('+n+'/'+b.hints.length+')';bt.disabled=n>=b.hints.length};
 bt.onclick=()=>{S.hints[b.id]=(S.hints[b.id]||0)+1;save();upd()};upd();
 w.append(bt,box);return w;
}
function puzzle(b,ok){
 const c=el('div','puz','<h3 class="cz">'+(b.label||'Acertijo')+'</h3><div>'+b.q+'</div>');
 if(b.type==='sudoku')return sudoku(b,ok,c);
 if(ok){c.append(el('div','fb good',b.ok||''));return c}
 const fb=el('div','fb');
 if(b.type==='choice'){
  const o=el('div','opts');b.opts.forEach((x,i)=>{const bt=el('button','',x[0]+(x[1]?'<small>'+x[1]+'</small>':''));bt.onclick=()=>i===b.right?solve(b):(fb.className='fb bad',fb.textContent='No es correcto. Piénsalo otra vez.');o.append(bt)});c.append(o);
 }else if(b.type==='logic'){
  b.hintsList=1;c.append(logic(b,fb));
 }else{
  const r=el('div','row'),i=el('input');i.type='text';i.autocomplete='off';i.placeholder='Tu respuesta';const bt=el('button','pri','Comprobar');
  const chk=()=>{let v=nm(i.value);if(b.strip)v=v.replace(/ /g,'');if(b.ans.some(a=>nm(a)===v))solve(b);else{fb.className='fb bad';fb.textContent='Esa no es la respuesta. Inténtalo de nuevo.'}};
  bt.onclick=chk;i.onkeydown=e=>{if(e.key==='Enter')chk()};r.append(i,bt);c.append(r);
 }
 c.append(fb,hintsUI(b));return c;
}
function sudoku(b,ok,c){
 const g=el('div','sud');
 for(let k=0;k<81;k++){const i=el('input',ORG.includes(k)?'o':'');i.type='text';i.inputMode='numeric';i.maxLength=1;
  if(PUZ[k]!=='0'){i.value=PUZ[k];i.disabled=true}else if(ok){i.value=SOL[k];i.disabled=true}else{i.value=S.sud[k]||'';i.oninput=()=>{i.value=i.value.replace(/[^1-9]/g,'');S.sud[k]=i.value;save()}}
  g.append(i)}
 c.append(g);
 if(ok){c.append(el('div','fb good',b.ok));return c}
 const fb=el('div','fb'),r=el('div','row'),bt=el('button','pri','Comprobar sudoku');
 bt.onclick=()=>{let miss=0,bad=0;for(let k=0;k<81;k++)if(PUZ[k]==='0'){if(!S.sud[k])miss++;else if(S.sud[k]!==SOL[k])bad++}
  if(!miss&&!bad)solve(b);else{fb.className='fb bad';fb.textContent=bad?'Hay números incorrectos. Revisa filas, columnas y bloques.':'Aún faltan casillas por completar.'}};
 r.append(bt);c.append(r,fb,hintsUI(b));return c;
}
function logic(b,fb){
 const w=el('div');
 w.append(el('div','card','<b>Personajes</b> · <b>Dante</b>: mano derecha de Gav. <b>Gael</b>: recién llegado, acaba de firmar. <b>Gav</b>: gobernante del Valle, el único con acceso a los contratos.<br><b>Lugares</b> · La Estatua (donde Gav guarda los contratos) · El Palacio · El pasillo de salida.<br><b>Objetos</b> · La llave dorada (abre el camino de salida) · La copia del contrato (hay que conseguir el original) · El reloj de bolsillo (tiempo antes de que el contrato de Gael se selle).<ol><li>Gav se encontraba junto a la estatua.</li><li>Quien se encontraba en el palacio tenía el contrato.</li><li>Gael nunca estuvo junto a la estatua.</li><li>Quien llevaba el reloj de bolsillo se encontraba en el pasillo de salida.</li><li>Dante nunca estuvo en el palacio.</li><li>Quien estaba junto a la estatua tenía la llave dorada.</li><li>Gael nunca estuvo en el pasillo de salida.</li><li>Dante no tenía el contrato.</li></ol>'));
 const t=el('table','lg','<tr><th></th><th>Lugar</th><th>Objeto</th></tr>');
 const sel=(n,j,L)=>{const s=el('select','','<option value="">—</option>'+L.map(x=>'<option>'+x+'</option>').join(''));s.value=(S.lg[n]||[])[j]||'';s.onchange=()=>{S.lg[n]=S.lg[n]||['',''];S.lg[n][j]=s.value;save()};return s};
 Object.keys(LSOL).forEach(n=>{const tr=el('tr','','<th>'+n+'</th>');const a=el('td'),o=el('td');a.append(sel(n,0,PL));o.append(sel(n,1,OB));tr.append(a,o);t.append(tr)});
 const sc=el('div','sc');sc.append(t);w.append(sc);
 const bt=el('button','pri','Comprobar');bt.style.marginTop='.6rem';
 bt.onclick=()=>{const okk=Object.keys(LSOL).every(n=>(S.lg[n]||[])[0]===LSOL[n][0]&&(S.lg[n]||[])[1]===LSOL[n][1]);if(okk)solve(b);else{fb.className='fb bad';fb.textContent='Alguna combinación no encaja con las pistas.'}};
 w.append(bt);return w;
}
function panel(k){
 const o=$('#ov'),c=$('#ovc');let h='<div class="row" style="justify-content:space-between;margin:0"><h3 class="cz" style="margin:0">'+(k==='a'?'Archivo del valle':'Libreta')+'</h3><button id="x">Cerrar ✕</button></div>';
 if(k==='a'){const A='ABCDEFGHIJKLMNÑOPQRSTUVWXYZ',B='QMAZÑTBXRHUCWEKPIVDYGONSJLF';
  h+='<p><i>Recuerda esta página, podrías necesitarla más adelante.</i></p><h3 class="cz">Alfabeto de los susurros</h3><div class="sc"><table><tr>'+[...A].map(x=>'<td>'+x+'</td>').join('')+'</tr><tr>'+[...B].map(x=>'<td><b>'+x+'</b></td>').join('')+'</tr></table></div>'
  +'<h3 class="cz">Decodificador de llaves</h3><p>Rojo: Capítulo 6<br>Negro: Capítulo 2<br>Plateado: Capítulo 4</p>'
  +'<h3 class="cz">Ayuda para el sudoku</h3><div class="sc"><table><tr><th>Número</th>'+[1,2,3,4,5,6,7].map(x=>'<td>'+x+'</td>').join('')+'</tr><tr><th>Letra</th>'+[...'EUASATT'].map(x=>'<td><b>'+x+'</b></td>').join('')+'</tr></table></div>'
  +'<p><b>¿Cómo funciona?</b></p><ol><li>Completa primero el sudoku.</li><li>Identifica los números de las casillas naranjas.</li><li>Busca cada número en la clave.</li><li>Reemplaza cada número por su letra.</li><li>Lee de izquierda a derecha y de arriba hacia abajo.</li></ol><p><i>El orden importa: no cambies la posición de los números al convertirlos en letras.</i></p>';
 }else{h+='<p>Los números que vayas descubriendo se guardan aquí.</p>'+[1,3,5,9].map(n=>'<div class="slot"><span>Cap. '+n+'</span><b>'+(S.digits[n]??'?')+'</b></div>').join('')+'<p><i>Con ellos formarás el código final.</i></p>'}
 c.innerHTML=h;o.classList.add('on');$('#x').onclick=()=>o.classList.remove('on');
}
$('#ov').onclick=e=>{if(e.target.id==='ov')e.target.classList.remove('on')};
$('#bA').onclick=()=>panel('a');$('#bL').onclick=()=>panel('l');$('#home').onclick=()=>go(0);
$('#bT').onclick=()=>{const r=document.documentElement,d=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=d?'light':'dark'};
if(S.cur&&!C[S.cur])S.cur=0;
render();
</script>
</body>
</html>
